<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="100%" stop-color="#020617" />
        </radialGradient>
        <linearGradient id="platinum" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="50%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#94a3b8" />
        </linearGradient>
        <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
        <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
        </filter>
    </defs>

    <!-- Background rounded square for PWA/icons -->
    <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
    
    <!-- Subtle Grid Background -->
    <path d="M 0,128 L 512,128 M 0,256 L 512,256 M 0,384 L 512,384 M 128,0 L 128,512 M 256,0 L 256,512 M 384,0 L 384,512" stroke="#ffffff" stroke-width="1" opacity="0.05" />
    
    <g filter="url(#shadow)">
        <!-- Outer Orbital Rings (Quantum Probability Field) -->
        <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="2 16" opacity="0.6" />
        <circle cx="256" cy="256" r="145" fill="none" stroke="url(#platinum)" stroke-width="1.5" opacity="0.3" />
        
        <!-- Glowing Halos -->
        <path d="M 256 86 A 170 170 0 0 1 426 256" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" filter="url(#neon)" opacity="0.9" />
        <path d="M 256 426 A 170 170 0 0 1 86 256" fill="none" stroke="url(#platinum)" stroke-width="6" stroke-linecap="round" filter="url(#neon)" opacity="0.9" />

        <!-- Neural Hexagon (Core Stochastic Engine) -->
        <g stroke-width="5" stroke-linejoin="round">
            <!-- Outer Hex -->
            <polygon points="256,120 374,188 374,324 256,392 138,324 138,188" fill="#0f172a" stroke="url(#platinum)" opacity="0.9" />
            <!-- Inner Hex (Glow) -->
            <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="3" filter="url(#neon)" />
            
            <!-- Inner Neural Connections to Center -->
            <line x1="256" y1="120" x2="256" y2="256" stroke="url(#platinum)" stroke-width="3" opacity="0.8" />
            <line x1="374" y1="188" x2="256" y2="256" stroke="url(#platinum)" stroke-width="3" opacity="0.8" />
            <line x1="374" y1="324" x2="256" y2="256" stroke="url(#platinum)" stroke-width="3" opacity="0.8" />
            <line x1="256" y1="392" x2="256" y2="256" stroke="url(#platinum)" stroke-width="3" opacity="0.8" />
            <line x1="138" y1="324" x2="256" y2="256" stroke="url(#platinum)" stroke-width="3" opacity="0.8" />
            <line x1="138" y1="188" x2="256" y2="256" stroke="url(#platinum)" stroke-width="3" opacity="0.8" />
        </g>

        <!-- Neural Nodes -->
        <circle cx="256" cy="120" r="14" fill="url(#platinum)" shadow="0 0 10px #fff" />
        <circle cx="374" cy="188" r="14" fill="url(#platinum)" />
        <circle cx="374" cy="324" r="14" fill="url(#platinum)" />
        <circle cx="256" cy="392" r="14" fill="url(#platinum)" />
        <circle cx="138" cy="324" r="14" fill="url(#platinum)" />
        <circle cx="138" cy="188" r="14" fill="url(#platinum)" />
        
        <!-- Inner Nodes -->
        <circle cx="256" cy="160" r="6" fill="url(#accent)" filter="url(#neon)" />
        <circle cx="339" cy="208" r="6" fill="url(#accent)" filter="url(#neon)" />
        <circle cx="339" cy="304" r="6" fill="url(#accent)" filter="url(#neon)" />
        <circle cx="256" cy="352" r="6" fill="url(#accent)" filter="url(#neon)" />
        <circle cx="173" cy="304" r="6" fill="url(#accent)" filter="url(#neon)" />
        <circle cx="173" cy="208" r="6" fill="url(#accent)" filter="url(#neon)" />

        <!-- Center Core / Singularity -->
        <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#neon)" />
        <circle cx="256" cy="256" r="14" fill="url(#accent)" />
    </g>
</svg>
