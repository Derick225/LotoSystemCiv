<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
    <defs>
        <linearGradient id="platinumText" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#94a3b8" />
        </linearGradient>
        <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <filter id="glowDrop" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.5"/>
        </filter>
        <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="100%" stop-color="#020617" />
        </radialGradient>
    </defs>
    
    <!-- Neural Hexagon Icon Embedding / Scaled down -->
    <g transform="translate(10, 20) scale(0.39)">
        <!-- Icon start -->
        <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
        <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentText)" stroke-width="10" stroke-dasharray="10 30" opacity="0.6" />
        <path d="M 256 86 A 170 170 0 0 1 426 256" fill="none" stroke="url(#accentText)" stroke-width="12" stroke-linecap="round" filter="url(#neon)" opacity="1" />
        <path d="M 256 426 A 170 170 0 0 1 86 256" fill="none" stroke="url(#platinumText)" stroke-width="12" stroke-linecap="round" filter="url(#neon)" opacity="1" />
        <g stroke-width="10" stroke-linejoin="round">
            <polygon points="256,120 374,188 374,324 256,392 138,324 138,188" fill="#0f172a" stroke="url(#platinumText)" />
            <line x1="256" y1="120" x2="256" y2="256" stroke="url(#platinumText)" stroke-width="6" />
            <line x1="374" y1="188" x2="256" y2="256" stroke="url(#platinumText)" stroke-width="6" />
            <line x1="374" y1="324" x2="256" y2="256" stroke="url(#platinumText)" stroke-width="6" />
            <line x1="256" y1="392" x2="256" y2="256" stroke="url(#platinumText)" stroke-width="6" />
            <line x1="138" y1="324" x2="256" y2="256" stroke="url(#platinumText)" stroke-width="6" />
            <line x1="138" y1="188" x2="256" y2="256" stroke="url(#platinumText)" stroke-width="6" />
        </g>
        <circle cx="256" cy="120" r="24" fill="url(#platinumText)" />
        <circle cx="374" cy="188" r="24" fill="url(#platinumText)" />
        <circle cx="374" cy="324" r="24" fill="url(#platinumText)" />
        <circle cx="256" cy="392" r="24" fill="url(#platinumText)" />
        <circle cx="138" cy="324" r="24" fill="url(#platinumText)" />
        <circle cx="138" cy="188" r="24" fill="url(#platinumText)" />
        <circle cx="256" cy="256" r="40" fill="#ffffff" filter="url(#neon)" />
        <!-- Icon end -->
    </g>

    <!-- Text: LotoPro -->
    <text x="240" y="115" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="96" fill="url(#platinumText)" letter-spacing="-3">Loto</text>
    <text x="445" y="115" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="96" fill="url(#accentText)" filter="url(#glowDrop)" letter-spacing="-3">Pro</text>
    
    <!-- Text: Platinum Elite -->
    <text x="245" y="180" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="32" fill="#94a3b8" letter-spacing="10">PLATINUM ELITE</text>
    <path d="M 245 198 L 650 198" stroke="url(#accentText)" stroke-width="3" opacity="0.4" />
    <!-- Cosmetic Accents on the line -->
    <circle cx="650" cy="198" r="5" fill="#c084fc" />
    <circle cx="245" cy="198" r="5" fill="#818cf8" />
    <rect x="580" y="195" width="20" height="6" fill="url(#accentText)" opacity="0.6" />
</svg>
