name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy_firebase:
    name: Deploy Firebase Rules, Indexes & Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application (optional verification)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v13.23.0
        with:
          args: deploy --only firestore,storage,functions
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
